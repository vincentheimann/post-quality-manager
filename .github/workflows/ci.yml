# CI for the Post Quality Manager repo (story 5.1 tracer bullet).
#
# Built assets never live in git: the build job builds them on every push/PR
# and uploads the result as the admin-build artifact, which the plugin-check
# job consumes — release.yml builds the released commit itself when zipping
# the post-quality-manager/ subfolder. The build job lints src/ and tests/js/
# first (npm run lint:js) and runs the JS unit tests (npm run test:unit); the
# php job lints every plugin PHP file on 8.0 (the header's Requires PHP floor)
# and 8.3, and runs the full tests/harness sweep on 8.3 only (harnesses may
# use newer PHP than the plugin).
#
# WordPress Plugin Check (stories 4.4, 4.5) runs on the built plugin folder —
# the same post-quality-manager/ release.yml zips, with admin/build/ restored
# from the artifact — in all categories. Blocking: any error fails the job;
# warnings never do (the action fails on errors only). Accepted warnings are
# triaged in the 4.5 plan. Findings show as file annotations, in the job log,
# and as the plugin-check-results artifact.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build admin app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: JS unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Assert built assets exist
        run: |
          test -f post-quality-manager/admin/build/index.js
          test -f post-quality-manager/admin/build/index.asset.php

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: post-quality-manager/admin/build/

  php:
    name: PHP ${{ matrix.php }} lint and harness sweep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Lint plugin PHP
        run: find post-quality-manager -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Harness sweep
        if: matrix.php == '8.3'
        run: |
          for f in tests/harness/*.php; do
            echo "== $f"
            php "$f" || exit 1
          done

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: post-quality-manager/admin/build

      - name: Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./post-quality-manager
          # readme.txt is written by backlog story 38 (WordPress.org listing),
          # which removes this ignore.
          ignore-codes: no_plugin_readme
