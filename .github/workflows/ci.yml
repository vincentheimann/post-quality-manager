# CI for the Post Quality Manager repo (story 5.1 tracer bullet).
#
# When it runs (2026-10-15; every PR since entry 8, 2026-11-11): every PR
# runs every job, Plugin Check included, docs-only ones too, so each PR
# reports the four checks main requires; a push runs only on main, and there
# only the build and PHP jobs run. A push to any other branch runs nothing:
# its PR's run covers it. A newer run on the same PR cancels the older one;
# runs on main each get their own group (run_id), so they are never
# cancelled and may run in parallel. release-please's PR opens no CI of its
# own (GITHUB_TOKEN), so the owner merges it past the pending checks as
# admin, and its merge to main is guarded by the harness sweep only:
# release-header-harness.php checks the version and Stable tag = Version;
# "Tested up to" is checked by Plugin Check on the next PR.
#
# Built assets never live in git: the build job builds them and uploads the
# result as the admin-build artifact, which the plugin-check job consumes —
# release.yml builds the released commit itself when zipping the
# post-quality-manager/ subfolder. The build job lints src/ and tests/js/
# first (npm run lint:js) and runs the JS unit tests (npm run test:unit); the
# php job lints every plugin PHP file and runs the full tests/harness sweep on
# 8.1, the header's Requires PHP floor (ADR 0018: the floor runs the project's
# checks, harnesses included), then does both again on 8.3, in one job (two
# setup-php steps).
#
# WordPress Plugin Check (stories 4.4, 4.5) runs on the built plugin folder —
# the same post-quality-manager/ release.yml zips, with admin/build/ restored
# from the artifact — in all categories. Blocking: any error fails the job;
# warnings never do (the action fails on errors only). Accepted warnings are
# triaged in the 4.5 plan. Since the readme exists (2026-10-13), its rules run
# too: Stable tag must equal the header Version, and Tested up to must be the
# current WordPress major, so a new major turns this check red until the
# readme is re-tested. Findings show as file annotations, in the job log,
# and as the plugin-check-results artifact.
#
# The free-build job (story 54, ADR 0014) strips that same folder the way
# Freemius's deployment builds the Free version (bin/build-free.php: fails on
# any premium code left behind), uploads it as the free-build artifact and
# runs Plugin Check on it with the same settings. The harness sweep's
# free-build-harness.php checks the stripped tree's content.

name: CI

# No path filters: main requires the four checks, and a required check whose
# workflow a filter skipped never reports, so the merge waits on it
# (memory/delivery-pipeline.md, entry 8).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build admin app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: JS unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Assert built assets exist
        run: |
          test -f post-quality-manager/admin/build/index.js
          test -f post-quality-manager/admin/build/index.asset.php
          test -f post-quality-manager/admin/build/meta-box.js
          test -f post-quality-manager/admin/build/meta-box.asset.php
          # The kit's rules both entries share land in style-index.css (story 109); the box loads it too.
          grep -q 'pqm-pillars' post-quality-manager/admin/build/style-index.css

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: admin-build
          path: post-quality-manager/admin/build/

  php:
    name: PHP lint and harness sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vendor/ holds the Freemius SDK as released (story 44): not ours to lint.
      # bin/ holds the Free-build scripts (story 54), on the same PHP floor.
      # 8.1 is the header's Requires PHP floor (ADR 0018), and the harnesses
      # run on it too; release-header-harness.php fails when no php-version
      # in this job is the floor or one is below it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint plugin PHP on 8.1
        run: |
          php -v | head -n 1
          find post-quality-manager bin -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Harness sweep on 8.1
        run: |
          for f in tests/harness/*.php; do
            echo "== $f"
            php "$f" || exit 1
          done

      # !cancelled(): a failed 8.1 step still lets the 8.3 lint and sweep
      # report; the job fails if any step failed.
      - uses: shivammathur/setup-php@v2
        if: ${{ !cancelled() }}
        with:
          php-version: '8.3'

      - name: Lint plugin PHP on 8.3
        if: ${{ !cancelled() }}
        run: |
          php -v | head -n 1
          find post-quality-manager bin -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Harness sweep on 8.3
        if: ${{ !cancelled() }}
        run: |
          for f in tests/harness/*.php; do
            echo "== $f"
            php "$f" || exit 1
          done

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: admin-build
          path: post-quality-manager/admin/build

      - name: Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./post-quality-manager
          # The vendored Freemius SDK (story 44) ships unmodified; Plugin Check
          # covers our own code only.
          exclude-directories: vendor

  free-build:
    name: Free build Plugin Check
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: admin-build
          path: post-quality-manager/admin/build

      - name: Build the Free tree
        run: php bin/build-free.php build/free

      - name: Upload the Free tree
        uses: actions/upload-artifact@v7
        with:
          name: free-build
          path: build/free/

      - name: Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./build/free/post-quality-manager
          exclude-directories: vendor
