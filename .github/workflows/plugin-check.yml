# WordPress Plugin Check (stories 4.4, 4.5) on the built plugin folder — the
# same post-quality-manager/ release.yml zips, with admin/build/ inside — in
# all categories. Blocking: any error fails the job; warnings never do (the
# action fails on errors only). Accepted warnings are triaged in the 4.5 plan.
# Findings show as file annotations, in the job log, and as the
# plugin-check-results artifact.

name: Plugin Check

on:
  push:
  pull_request:

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./post-quality-manager
          # readme.txt is written by backlog story 38 (WordPress.org listing),
          # which removes this ignore.
          ignore-codes: no_plugin_readme
