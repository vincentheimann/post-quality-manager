# Release pipeline (epic-delivery-pipeline, story 4.1).
#
# On every push to main, release-please opens or updates one release PR from
# the Conventional Commits (config: release-please-config.json). Merging that
# PR tags v<version> and creates a *draft* GitHub Release. Events made with
# GITHUB_TOKEN start no other workflow and drafts never fire `release`, so the
# package job runs here, gated on release_created: it builds admin/build/ from
# the tag and zips post-quality-manager/ as post-quality-manager-<version>.zip,
# the full build, kept as a workflow artifact.
#
# Then (story 58, ADR 0014) that zip goes to Freemius as an unreleased
# (pending) version through its product-scoped API, with the
# FREEMIUS_API_TOKEN secret (product Settings → API & Keys). The Free and Pro
# builds Freemius generates come back as artifacts <zip>-free.zip and
# <zip>-pro.zip; the Free one is checked and diffed against bin/build-free.php.
# Releasing the version to customers stays an owner step.
#
# Last, once that check has passed (entry 8, ADR 0014 amended 2026-10-28), the
# publish step attaches the Free build to the release under the zip's name,
# appends docs/release-notes/<version>.md when present, and publishes it,
# shown as Latest (a pre-release only while the config sets "prerelease").
# A red step anywhere before leaves the release a draft with its tag and no
# zip: fix the cause and re-run the job. A re-run uploads nothing to Freemius
# twice, and the draft's body holds no notes yet, so they are appended once.
#
# A manual dispatch runs only the package job on the chosen ref and uploads the
# zip as a workflow artifact: no Freemius call, no tag, no release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  package:
    name: Package plugin zip
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On a release, build the tagged commit; on a dispatch, the dispatched ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Header Version, POSTQUALITY_VERSION and package.json must agree before
      # anything is built or published; on a mismatch the release stays a
      # draft. PHP ships on ubuntu-latest.
      - name: Versions agree
        run: php tests/harness/release-header-harness.php

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert built assets exist
        run: |
          test -f post-quality-manager/admin/build/index.js
          test -f post-quality-manager/admin/build/index.asset.php
          test -f post-quality-manager/admin/build/meta-box.js
          test -f post-quality-manager/admin/build/meta-box.asset.php

      - name: Zip the plugin folder
        id: zip
        run: |
          V=$(node -p "require('./package.json').version")
          zip -rq "post-quality-manager-$V.zip" post-quality-manager
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=post-quality-manager-$V.zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.file }}
          path: ${{ steps.zip.outputs.file }}
          if-no-files-found: error
          # A re-run of the package job replaces the artifact instead of failing.
          overwrite: true

      # Story 58. Freemius API, product scope (OpenAPI spec read 2026-10-13,
      # tags/latest.json taken up 2026-11-03): GET tags/latest.json, POST
      # tags.json, PUT tags/{id}.json (release_mode), GET tags/{id}.zip.
      - name: Deploy to Freemius (unreleased) and fetch its builds
        id: freemius
        if: needs.release-please.outputs.release_created == 'true'
        env:
          FREEMIUS_API_TOKEN: ${{ secrets.FREEMIUS_API_TOKEN }}
          API: https://api.freemius.com/v1/products/41144
          V: ${{ steps.zip.outputs.version }}
          ZIP: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${FREEMIUS_API_TOKEN:-}" ]; then
            echo "::error::FREEMIUS_API_TOKEN secret is not set (Freemius → product Settings → API & Keys)"
            exit 1
          fi
          # Prints the response body; on an HTTP error, prints Freemius's error
          # body (never the request) and fails.
          api() {
            local out; out=$(mktemp)
            if curl -sS --fail-with-body -o "$out" -H "Authorization: Bearer $FREEMIUS_API_TOKEN" "$@"; then
              cat "$out"
            else
              echo "::error::Freemius API: $(cat "$out")" >&2
              return 1
            fi
          }
          # $1 = is_premium, $2 = file. Up to 5 attempts, 10 s apart: the
          # builds may not be ready the moment the upload returns.
          get_zip() {
            local code=000
            for _ in 1 2 3 4 5; do
              code=$(curl -sSL -o "$2" -w '%{http_code}' -H "Authorization: Bearer $FREEMIUS_API_TOKEN" "$API/tags/$ID.zip?is_premium=$1") || code=000
              if [ "$code" = 200 ] && [ -s "$2" ]; then return 0; fi
              sleep 10
            done
            echo "::error::Freemius answered $code for the is_premium=$1 build of deployment $ID"
            return 1
          }

          sha256sum "$ZIP"

          # Is this version on Freemius already? Only the newest deployment can
          # say, and only the fields used here are kept from its reply
          # (memory/delivery-pipeline.md).
          TAG=$(api "$API/tags/latest.json?type=all&is_premium=false" | jq -c '{id, version, has_free, release_mode, requires_programming_language_version}')

          if [ "$(jq -r .version <<<"$TAG")" = "$V" ]; then
            ID=$(jq -r .id <<<"$TAG")
            echo "Version $V is already on Freemius as deployment $ID ($(jq -r .release_mode <<<"$TAG")): that first upload is what customers and SVN get; this run's zip may differ byte for byte."
          else
            ID=$(api -X POST -F "file=@$ZIP;type=application/zip" "$API/tags.json" | jq -er .id)
            TAG=$(api -X PUT -H 'Content-Type: application/json' -d '{"release_mode":"pending"}' "$API/tags/$ID.json")
            echo "Uploaded $ZIP to Freemius as deployment $ID, release mode $(jq -r .release_mode <<<"$TAG")."
          fi
          # The PHP requirement Freemius recorded for the version, which the SDK
          # hands to WordPress's update gate for Pro updates; Freemius reads it
          # from readme.txt (memory/delivery-pipeline.md). /release step 7 reads
          # this line and says what a warning calls for.
          WANT=$(sed -n 's/^Requires PHP:[[:space:]]*//p' post-quality-manager/readme.txt | head -n 1 | tr -d '[:space:]')
          GOT=$(jq -r '.requires_programming_language_version // empty' <<<"$TAG")
          if [ -z "$GOT" ]; then
            echo "::warning::Freemius's reply for $V carries no PHP requirement (readme.txt says ${WANT:-none}): read the Deployment page's Min PHP version column (/release step 7)"
          elif [ "$GOT" != "$WANT" ]; then
            echo "::warning::Freemius records Requires PHP $GOT for $V while readme.txt says ${WANT:-none} (/release step 7)"
          else
            echo "Freemius records Requires PHP $GOT for $V, as readme.txt says."
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

          PRO="${ZIP%.zip}-pro.zip"
          get_zip true "$PRO"
          echo "pro=$PRO" >> "$GITHUB_OUTPUT"
          echo "Pro build root folder: $(unzip -Z1 "$PRO" | awk -F/ 'NR==1 { print $1 }')"

          if [ "$(jq -r .has_free <<<"$TAG")" != true ]; then
            echo "::error::Freemius generated no Free build: the product needs a Free plan (Plans)"
            exit 1
          fi
          FREE="${ZIP%.zip}-free.zip"
          get_zip false "$FREE"
          echo "free=$FREE" >> "$GITHUB_OUTPUT"

      # Kept even when the Free side fails, for the record.
      - name: Upload the Freemius Pro build
        if: always() && steps.freemius.outputs.pro != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.freemius.outputs.pro }}
          path: ${{ steps.freemius.outputs.pro }}
          if-no-files-found: error
          overwrite: true

      # /release step 8, then the diff against the local strip (plan D2).
      - name: Check the Free build Freemius generated
        if: needs.release-please.outputs.release_created == 'true'
        env:
          V: ${{ steps.zip.outputs.version }}
          FREE_ZIP: ${{ steps.freemius.outputs.free }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freemius-free"
          unzip -q "$FREE_ZIP" -d "$RUNNER_TEMP/freemius-free"
          F="$RUNNER_TEMP/freemius-free/post-quality-manager"
          if [ ! -f "$F/post-quality-manager.php" ]; then
            echo "::error::The Free build has no post-quality-manager/post-quality-manager.php; its root holds: $(ls "$RUNNER_TEMP/freemius-free")"
            exit 1
          fi
          FAIL=0
          if grep -rn __premium_only --exclude-dir=vendor "$F"; then
            echo "::error::Premium code survived in the Free build (lines above)"
            FAIL=1
          fi
          GOT=$(sed -n '/^[[:space:]]*\*[[:space:]]*Version:/{s/.*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p;q}' "$F/post-quality-manager.php")
          if [ "$GOT" != "$V" ]; then
            echo "::error::The Free build's header Version is '$GOT', expected '$V'"
            FAIL=1
          fi
          TEMPLATES=$(ls "$F/templates")
          if [ "$TEMPLATES" != n8n-workflow-free.json ]; then
            echo "::error::The Free build's templates/ holds: $TEMPLATES"
            FAIL=1
          fi
          php bin/build-free.php "$RUNNER_TEMP/local-free"
          L="$RUNNER_TEMP/local-free/post-quality-manager"
          # Freemius re-prints every PHP file (story 54's diff, 2026-10-13), so
          # PHP is compared as token streams; everything else byte for byte,
          # except the readme's Contributors line: Freemius added `freemius`
          # to it on a dashboard upload (3.5.1) and not on an API one (3.7.0).
          if ! php bin/compare-php-trees.php "$F" "$L"; then
            echo "::error::Freemius's Free build differs from bin/build-free.php in PHP (above): fix the stripper or the markers"
            FAIL=1
          fi
          if ! diff -ru -x '*.php' -I '^Contributors:' "$F" "$L" || ! diff -rq "$F/vendor" "$L/vendor"; then
            echo "::error::Freemius's Free build differs from bin/build-free.php outside PHP (above)"
            FAIL=1
          fi
          exit "$FAIL"

      - name: Upload the Freemius Free build
        if: needs.release-please.outputs.release_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.freemius.outputs.free }}
          path: ${{ steps.freemius.outputs.free }}
          if-no-files-found: error
          overwrite: true

      # Entry 8 (ADR 0014, amended 2026-10-28): last, so the release is
      # published only once the Free build check has passed; it carries that
      # Free build under the release zip's name. Until then it stays a draft.
      - name: Attach the Free build, append release notes, publish
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ZIP: ${{ steps.zip.outputs.file }}
          FREE_ZIP: ${{ steps.freemius.outputs.free }}
          NOTES: docs/release-notes/${{ steps.zip.outputs.version }}.md
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$FREE_ZIP" "$RUNNER_TEMP/release/$ZIP"
          gh release upload "$TAG" "$RUNNER_TEMP/release/$ZIP" --clobber
          BODY="$RUNNER_TEMP/release-body.md"
          gh release view "$TAG" --json body --jq .body > "$BODY"
          if [ -f "$NOTES" ]; then
            printf '\n' >> "$BODY"
            cat "$NOTES" >> "$BODY"
          fi
          # release-please flags a release as pre-release only for a
          # suffixed or 0.x version (src/manifest.ts), so the config's
          # "prerelease" key is applied here; without it (public since
          # 4.0.0) it reads as false.
          PRE=$(jq -r '.prerelease // false' release-please-config.json)
          gh release edit "$TAG" --notes-file "$BODY" --draft=false --prerelease="$PRE"
