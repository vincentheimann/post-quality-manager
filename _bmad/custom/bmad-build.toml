# House rules for bmad-build (team override, committed).
# Base defaults: .claude/skills/bmad-build/customize.toml — strings replace, lists append.

[workflow]

# Standing context for every build: the self-correction log (its rules override
# agent defaults) and the Definition of Done from AGENTS.md.
persistent_facts = [
  "file:memory/lessons.md",
  "Definition of Done (AGENTS.md): KISS; `php -l` passes on every touched PHP file and `node --check` on every touched JS file; every CLI harness in tests/harness/ passes (plain PHP + WP stubs — extend one, or add one, whenever the plan carries an I/O & Edge-Case Matrix); no WP debug errors or warnings; REST endpoints answer 200 with the right JSON and permission_callback; UI loading and error states handled; when a REST route or the webhook payload changes, post-quality-manager/templates/n8n-workflow.json is checked for a matching change (placeholders `__PQM_*__` only, never site values); durable facts updated in memory/, significant decisions recorded with /adr, docs/user-paths.md adjusted when Unrealized Value became Current Value.",
  "AI prompts in the n8n workflow stay niche-agnostic: universal pillars Structure, Readability, Engagement, Credibility; niche tailoring comes from user settings, never from code.",
  "Read docs/brand.md before writing any admin UI text, label, or copy.",
  "Never commit or push: present the change and let the user decide. Branches: feat/, fix/, chore/; Conventional Commits.",
]

# House rules the vendored steps contradict (step-05-present.md and
# step-oneshot.md both end with an unconditional local commit; no step checks
# the branch). These run at activation and bind every later step of the run.
activation_steps_append = [
  "Branch guard: run `git branch --show-current`. If it prints `main`, HALT before any file change and ask the user for a branch name (prefix feat/, fix/ or chore/, derived from the intent); create it only after they answer. Never work on main.",
  "Commit rule for this project: the user commits, never the agent. Wherever a later step of this workflow says to commit (step 05 'Commit and Complete', the oneshot 'Commit' section), do NOT run `git commit`; leave the files in the working tree, list the files touched, propose a Conventional Commits message derived from the plan title, and let the user commit. Report 'no commit (house rule)' where the step asks for a commit hash.",
]

# House rule: a plan the user approves before code, except for small changes.
# "full" writes the plan and halts at CHECKPOINT 1; "oneshot" implements directly.
route_selection = """
Decide whether to use a coding subagent (full) or implement directly (oneshot).
Using the information already gathered, with no further reading and minimal
extra reasoning, estimate the lines of code to add or modify and the files touched.
Oneshot only when all hold: 100 lines or fewer, at most 3 files, and no change
to the DB schema, a REST route or its payload, or the n8n workflow template.
Otherwise: full — the plan checkpoint is how the user approves work before code.
"""
