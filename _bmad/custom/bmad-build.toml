# House rules for bmad-build (team override, committed).
# Base defaults: .claude/skills/bmad-build/customize.toml — strings replace, lists append.

[workflow]

# Standing context for every build: the self-correction log (its rules override
# agent defaults) and the Definition of Done from AGENTS.md.
persistent_facts = [
  "file:memory/lessons.md",
  "Definition of Done (AGENTS.md): KISS; `php -l` passes on every touched PHP file and `node --check` on every touched JS file; every CLI harness in tests/harness/ passes (plain PHP + WP stubs — extend one, or add one, whenever the plan carries an I/O & Edge-Case Matrix); `npm run test:unit` passes (Jest + jsdom in tests/js/ — add or extend a test for matrix rows only a browser can show); no WP debug errors or warnings; REST endpoints answer 200 with the right JSON and permission_callback; UI loading and error states handled; when a REST route or the webhook payload changes, post-quality-manager/templates/n8n-workflow.json is checked for a matching change (placeholders `__PQM_*__` only, never site values); a change existing sites meet without being told (a new default, a new permission, a removed screen, a workflow re-import) adds one line to `docs/release-notes/unreleased.md` in the same PR; durable facts updated in memory/, significant decisions recorded with /adr, docs/user-paths.md adjusted when Unrealized Value became Current Value.",
  "AI prompts in the n8n workflow stay niche-agnostic: universal pillars Structure, Readability, Engagement, Credibility; niche tailoring comes from user settings, never from code.",
  "Read docs/brand.md before writing any admin UI text, label, or copy.",
  "Commit, push and open the PR without asking (owner, 2026-10-29); merging stays the owner's. Branches: feat/, fix/, chore/; Conventional Commits.",
  "file:_bmad/custom/minimal-code-ladder.md",
]

# House rules the vendored steps contradict (step-05-present.md and
# step-oneshot.md both end with an unconditional local commit; no step checks
# the branch). These run at activation and bind every later step of the run.
activation_steps_append = [
  "Branch guard: run `git branch --show-current`. If it prints `main`, HALT before any file change and ask the user for a branch name (prefix feat/, fix/ or chore/, derived from the intent); create it only after they answer. Never work on main.",
  "Commit rule for this project (owner, 2026-10-29): the agent commits, pushes and opens the PR without asking; only the merge is the user's. Where a later step says to commit (step 05 'Commit and Complete', the oneshot 'Commit' section), commit on the feature branch with a Conventional Commits message derived from the plan title, push it with `git push https://github.com/vincentheimann/post-quality-manager.git <branch>`, and open a draft PR with `gh pr create --repo vincentheimann/post-quality-manager`. Report the commit hash and the PR link. Never merge, never push to main.",
]

# House rule: a plan the user approves before code, except for small changes.
# "full" writes the plan and halts at CHECKPOINT 1; "oneshot" implements directly.
route_selection = """
Decide whether to use a coding subagent (full) or implement directly (oneshot).
Using the information already gathered, with no further reading and minimal
extra reasoning, estimate the lines of code to add or modify and the files touched.
Oneshot only when all hold: 100 lines or fewer, at most 3 files, and no change
to the DB schema, a REST route or its payload, or the n8n workflow template.
Otherwise: full — the plan checkpoint is how the user approves work before code.
"""

# House lens (ADR 0007): over-engineering review, appended to the thorough set
# the "full" route runs. The recipe and its tags live in the ladder file.
[[workflow.thorough_lenses]]
id = "overbuild"
name = "Overbuild Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Read `_bmad/custom/minimal-code-ladder.md` at the repository root completely and follow its "Reviewing: the `overbuild` lens" section as your review instructions; the rest of that file defines what must never be flagged.

Review content: the unified diff at `{diff_file}`. Read that file — it is the change under review. Search the repository before claiming a `reuse:` or `native:` replacement exists.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
